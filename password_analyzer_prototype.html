<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password Strength Analyzer</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent-bg:#eff4ff;--ok:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--text:#e6ecf7;--muted:#8fa0ba;--line:#243049;--accent:#6ea0ff;--accent-bg:#1a2744;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--text:#e6ecf7;--muted:#8fa0ba;--line:#243049;--accent:#6ea0ff;--accent-bg:#1a2744;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
button.ghost{background:var(--accent-bg);color:var(--accent)}
:root:not([data-theme="light"]) button:not(.ghost){color:#0b1220}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 8px}
.meter div{height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
.stats{display:flex;justify-content:space-between;font-size:.9rem;flex-wrap:wrap;gap:6px}
.label{font-weight:700}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.92rem}
.ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#fff;margin-top:1px}
.ic.y{background:var(--ok)}.ic.n{background:var(--bad)}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.sug code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:.92rem}
.sug button{padding:6px 12px;font-size:.8rem}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.9rem;display:none}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.bad{display:block;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.hist{font-size:.85rem;color:var(--muted);margin-top:12px;overflow-x:auto}
.tag{display:inline-block;background:var(--accent-bg);color:var(--accent);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Password Strength Analyzer</h1>
  <p class="sub">Check length, complexity and uniqueness, get stronger suggestions, and block reused passwords.</p>

  <div class="card">
    <h2>1. Analyze</h2>
    <label for="pw">Enter a password</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="off" placeholder="Type a password to test">
      <button class="ghost" id="toggle" type="button">Show</button>
    </div>
    <div class="meter"><div id="bar"></div></div>
    <div class="stats"><span class="label" id="lbl">Start typing…</span><span id="meta"></span></div>
    <ul id="checks"></ul>
  </div>

  <div class="card">
    <h2>2. Stronger alternatives</h2>
    <div id="sugs"></div>
    <div style="margin-top:12px"><button class="ghost" id="regen" type="button">Generate new</button></div>
  </div>

  <div class="card">
    <h2>3. Set password with reuse check <span class="tag">Optional DB</span></h2>
    <label for="user">Username</label>
    <input id="user" type="text" placeholder="e.g. ithris" style="margin-bottom:10px">
    <button id="save" type="button">Save password</button>
    <button class="ghost" id="clear" type="button">Clear history</button>
    <div class="msg" id="msg"></div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
const COMMON=["password","123456","12345678","123456789","qwerty","abc123","password1","111111","iloveyou","admin","welcome","letmein","monkey","dragon","football","login","passw0rd","qwerty123","admin123","000000","1q2w3e4r"];
const SEQS=["abcdefghijklmnopqrstuvwxyz","0123456789","qwertyuiop","asdfghjkl","zxcvbnm"];
const WORDS=["tiger","river","cloud","maple","rocket","guitar","planet","coffee","falcon","garden","silver","thunder","orange","pixel"];
const LEET={a:"@",e:"3",i:"!",o:"0",s:"$",t:"7"};
const $=id=>document.getElementById(id);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const pick=s=>s[rnd(s.length)];

function hasSeq(pw){const l=pw.toLowerCase();for(const s of SEQS)for(let i=0;i<=s.length-3;i++){const c=s.slice(i,i+3);if(l.includes(c)||l.includes([...c].reverse().join("")))return true}return false}
function entropy(pw){let p=0;if(/[a-z]/.test(pw))p+=26;if(/[A-Z]/.test(pw))p+=26;if(/\d/.test(pw))p+=10;if(/[^\w\s]/.test(pw)||/ /.test(pw))p+=32;return p?Math.round(pw.length*Math.log2(p)*10)/10:0}

function analyze(pw){
  const n=pw.length;
  const checks=[
    {ok:n>=12,t:"At least 12 characters"},
    {ok:/[a-z]/.test(pw),t:"Contains lowercase letters"},
    {ok:/[A-Z]/.test(pw),t:"Contains uppercase letters"},
    {ok:/\d/.test(pw),t:"Contains digits"},
    {ok:/[^\w\s]/.test(pw),t:"Contains special symbols"},
    {ok:n>0&&!COMMON.includes(pw.toLowerCase()),t:"Not a common password"},
    {ok:n>0&&!/(.)\1{2,}/.test(pw),t:"No repeated characters (aaa)"},
    {ok:n>0&&!hasSeq(pw),t:"No sequences (abc, 123, qwerty)"},
    {ok:n>0&&!/(19|20)\d{2}/.test(pw),t:"No years or dates"}
  ];
  let s=Math.min(n,16)*2.5;
  [/[a-z]/,/[A-Z]/,/\d/,/[^\w\s]/].forEach(r=>{if(r.test(pw))s+=10});
  if(COMMON.includes(pw.toLowerCase()))s=Math.min(s,10);
  if(/(.)\1{2,}/.test(pw))s-=10;
  if(hasSeq(pw))s-=10;
  if(/(19|20)\d{2}/.test(pw))s-=5;
  if(n&&new Set(pw).size<Math.max(4,n>>1))s-=10;
  if(n>=12&&checks.every(c=>c.ok))s+=20;
  s=Math.max(0,Math.min(100,Math.round(s)));
  const label=s<25?"Very Weak":s<50?"Weak":s<70?"Medium":s<90?"Strong":"Very Strong";
  const color=s<25?"#dc2626":s<50?"#f97316":s<70?"#eab308":s<90?"#22c55e":"#16a34a";
  return{s,label,color,checks};
}

function suggest(pw){
  const out=[];
  if(pw){
    let l=[...pw].map(c=>(LEET[c.toLowerCase()]&&rnd(2))?LEET[c.toLowerCase()]:c).join("");
    if(!/[A-Z]/.test(l))l=l.charAt(0).toUpperCase()+l.slice(1);
    out.push(l+pick("!@#$%^&*")+(100+rnd(900)));
  }
  while(out.length<2){out.push([0,1,2].map(()=>{const w=pick(WORDS);return w[0].toUpperCase()+w.slice(1)}).join("-")+(10+rnd(90))+pick("!@#$%"))}
  const al="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  let r;do{r=Array.from({length:16},()=>pick(al)).join("")}while(analyze(r).s<90);
  out.push(r);return out;
}

function render(){
  const pw=$("pw").value,a=analyze(pw);
  $("bar").style.width=(pw?a.s:0)+"%";$("bar").style.background=a.color;
  $("lbl").textContent=pw?a.label:"Start typing…";$("lbl").style.color=pw?a.color:"";
  $("meta").textContent=pw?`${a.s}/100 · ${entropy(pw)} bits · ${pw.length} chars`:"";
  $("checks").innerHTML=a.checks.map(c=>`<li><span class="ic ${c.ok?"y":"n"}">${c.ok?"✓":"✕"}</span>${c.t}</li>`).join("");
  drawSugs();
}
function drawSugs(){
  const list=suggest($("pw").value);
  $("sugs").innerHTML=list.map((s,i)=>`<div class="sug"><code>${s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</code><button class="ghost" data-i="${i}" type="button">Use</button></div>`).join("");
  $("sugs").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("pw").value=list[b.dataset.i];$("pw").type="text";$("toggle").textContent="Hide";render()});
}

/* ---- reuse prevention: salted PBKDF2 hashes kept in localStorage ---- */
const KEY="pw_history_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return mem}}
let mem=[];
function store(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hash(pw,salt){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},k,256));
}
function showMsg(t,ok){const m=$("msg");m.className="msg "+(ok?"ok":"bad");m.textContent=t}
function drawHist(){
  const h=load();
  $("hist").innerHTML=h.length?`<table style="width:100%;border-collapse:collapse"><tr><th align="left">User</th><th align="left">Stored hash (salted)</th></tr>${h.map(r=>`<tr><td>${r.u.replace(/</g,"&lt;")}</td><td><code>${r.h.slice(0,24)}…</code></td></tr>`).join("")}</table>`:"No saved passwords yet.";
}
$("save").onclick=async()=>{
  const pw=$("pw").value,u=$("user").value.trim();
  if(!u)return showMsg("Enter a username first.",false);
  if(!pw)return showMsg("Enter a password in section 1 first.",false);
  const a=analyze(pw);
  if(a.s<70)return showMsg(`Rejected: password is too weak (${a.s}/100). Try a suggestion above.`,false);
  if(!(window.crypto&&crypto.subtle))return showMsg("Secure hashing is not available in this browser.",false);
  const hist=load();
  for(const r of hist.filter(r=>r.u===u)){if(await hash(pw,unhex(r.s))===r.h)return showMsg("Rejected: you have used this password before.",false)}
  const salt=crypto.getRandomValues(new Uint8Array(16));
  hist.push({u,s:hex(salt),h:await hash(pw,salt)});store(hist);drawHist();
  showMsg("Password accepted and stored as a salted hash.",true);
};
$("clear").onclick=()=>{store([]);drawHist();showMsg("History cleared.",true)};
$("toggle").onclick=()=>{const p=$("pw");const s=p.type==="password";p.type=s?"text":"password";$("toggle").textContent=s?"Hide":"Show"};
$("regen").onclick=drawSugs;
$("pw").addEventListener("input",render);
render();drawHist();
</script>
</body>
</html>
